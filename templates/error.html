{% extends "base.html" %}
{% block title %}Service unavailable{% endblock %}
{% block content %}
<section class="error-card">
    <span class="error-mark">!</span>
    <span class="eyebrow muted-eyebrow">DATABASE CONNECTION</span>
    <h1>We couldn't reach the parking system.</h1>
    <p>{{ message }}</p>
    <a class="button button-primary" href="{{ url_for('dashboard') }}">Try again <span>↗</span></a>
</section>
{% endblock %}
